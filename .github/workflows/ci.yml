name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Scan code for vulnerable dependencies and leaked secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'   # report only for now

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image (PRs only, main builds in the push job)
        if: github.event_name == 'pull_request'
        run: docker build -t taskflow-api .

  push-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # lets the job request GitHub's signed identity token
      contents: read

    env:
      REPO: 446476244331.dkr.ecr.us-east-1.amazonaws.com/taskflow

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image (once)
        working-directory: backend
        run: docker build --provenance=false --sbom=false -t taskflow:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: taskflow:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'   # report only for now

      - name: Get AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::446476244331:role/taskflow-github-ci
          aws-region: us-east-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          docker tag taskflow:ci $REPO:$TAG
          docker push $REPO:$TAG
